[project]
name = "estimator"
version = "0.1.0"
description = "AI-powered software estimation service with typed input and versioned Jinja2 prompts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "litellm>=1.50",
    "instructor>=1.5",
    "redis>=5.0",
    "redisvl>=0.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "fpdf2>=2.7",
    # Session 6 — data-driven AI (ingestion, cleaning, PII).
    # sqlalchemy + psycopg[binary] (psycopg v3) are already declared above
    # (Session 5 persistence) — aligned with the professor's driver. alembic
    # manages only the two new Session-6 tables.
    # NOTE: unstructured[all-docs] is deliberately NOT added — the XLSX/DOCX/PDF
    # parsers that would use it ship only in the instructor's guides/, not here.
    "pandas>=2.2",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "faker>=24.0",
    # The Spanish spaCy model is not a PyPI dep; install it once with
    #   uv run python -m spacy download es_core_news_md
    # It is only needed at runtime (Presidio); unit tests stub the analyzer.
    # Session 7 — embeddings + chunking pipeline.
    # openai is already declared above (Session 1). tiktoken counts tokens with
    # the same model that embeds the text, so we can flag oversized chunks before
    # paying for an API call. No numpy/scikit-learn — cosine is done by hand.
    "tiktoken>=0.7.0",
    # Session 7 live — chunking-strategy comparison (RecursiveCharacterTextSplitter,
    # SemanticChunker, sentence tokenisation). openai/anthropic already declared above.
    "langchain-text-splitters>=0.3.0",
    "langchain-experimental>=0.3.0",
    "langchain-openai>=0.2.0",
    "nltk>=3.9",
    # Session 8 — pgvector persistence + semantic search.
    # asyncpg is the async driver SQLAlchemy 2.0 recommends for the hot-path
    # RAG endpoints (POST /embeddings/ingest, POST /search); the sync psycopg
    # (v3) driver above still backs Alembic and the Session-6 repositories. pgvector
    # registers the ``vector`` column type and the cosine_distance operator.
    "asyncpg>=0.29",
    "pgvector>=0.3",
    # SQLAlchemy's async engine bridges sync/async via greenlet; it is an
    # optional dep that does not come in transitively with the bare driver.
    "greenlet>=3.0",
    # Session 10 — cross-encoder reranking (recall-then-rerank). Pulls torch.
    "sentence-transformers>=3.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "fakeredis>=2.20",
    "deepeval>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
